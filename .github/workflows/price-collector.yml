name: Collect flight prices

# Real Google Flights prices for every route tracked on the website.
# Runs on a schedule and on demand; the website reads what this writes.

on:
  schedule:
    # 06:10, 12:10 and 18:10 UTC — often enough to see a fare move, gentle
    # enough not to hammer Google.
    - cron: "10 6,12,18 * * *"
  workflow_dispatch:
    inputs:
      flight_id:
        description: "Only price this tracked flight (UUID). Leave empty for all."
        required: false
  repository_dispatch:
    types: [collect-prices]

concurrency:
  group: price-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install the Google Flights client
        run: |
          python -m pip install --upgrade pip
          # `flights` ships without its CLI dependencies declared
          pip install "flights==0.9.0" click rich

      - name: Collect prices
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SKYBUDDY_SITE_URL: ${{ secrets.SKYBUDDY_SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          COLLECTOR_CURRENCY: EUR
        run: |
          python scripts/web_price_collector.py \
            ${{ inputs.flight_id && format('--flight-id {0}', inputs.flight_id) || '' }} \
            ${{ github.event.client_payload.flight_id && format('--flight-id {0}', github.event.client_payload.flight_id) || '' }}
